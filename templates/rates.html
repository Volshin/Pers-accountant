<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Курсы валют</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--card:#fff;--text:#111827;--muted:#6b7280;
  --primary:#2563eb;--header:#1e3a5f;--radius:14px;
  --shadow:0 1px 6px rgba(0,0,0,.08);--danger:#ef4444;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--header);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;opacity:.8;padding:0;line-height:1}
.back-btn:hover{opacity:1}
header h1{font-size:16px;font-weight:700}
.container{max-width:560px;margin:0 auto;padding:14px 12px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 0 8px 4px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:10px}

/* Add form */
.form-grid{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:8px;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.form-group input{border:1.5px solid #e5e7eb;border-radius:8px;padding:9px 10px;font-size:14px;outline:none;width:100%}
.form-group input:focus{border-color:var(--primary)}
.add-btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;height:38px}
.add-btn:hover{background:#1d4ed8}
.hint{font-size:11px;color:var(--muted);margin-top:6px}

/* Rates table */
.rates-table{width:100%;border-collapse:collapse}
.rates-table th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 8px;border-bottom:1.5px solid #f3f4f6}
.rates-table td{padding:10px 8px;font-size:14px;border-bottom:1px solid #f9fafb;vertical-align:middle}
.rates-table tr:last-child td{border-bottom:none}
.rates-table .cur-badge{font-weight:700;font-size:13px;background:#eff6ff;color:var(--primary);padding:2px 8px;border-radius:8px}
.del-btn{background:none;border:none;color:#d1d5db;font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.del-btn:hover{color:var(--danger)}
.empty-msg{text-align:center;color:var(--muted);padding:24px;font-size:14px}

@media(max-width:400px){
  .form-grid{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
  .add-btn{grid-column:1/-1}
}
</style>
</head>
<body>

<header>
  <button class="back-btn" onclick="location.href='/'">‹</button>
  <h1>Курсы валют</h1>
</header>

<div class="container">

  <div class="section-title">Добавить / обновить курс</div>
  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label>Месяц</label>
        <input type="month" id="f-month" placeholder="2026-01">
      </div>
      <div class="form-group">
        <label>Валюта</label>
        <input type="text" id="f-currency" placeholder="RSD" maxlength="3" style="text-transform:uppercase">
      </div>
      <div class="form-group">
        <label>Курс к EUR</label>
        <input type="number" id="f-rate" placeholder="0.00854" step="any" min="0">
      </div>
      <button class="add-btn" onclick="addRate()">Сохранить</button>
    </div>
    <div class="hint">Введите: 1 &lt;ВАЛЮТА&gt; = ? EUR. Например, 1 RSD = 0.00854 EUR</div>
  </div>

  <div class="section-title">Все курсы</div>
  <div class="card">
    <table class="rates-table">
      <thead>
        <tr>
          <th>Месяц</th>
          <th>Валюта</th>
          <th>1 ? = EUR</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rates-body">
        <tr><td colspan="4" class="empty-msg">Загрузка…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
async function loadRates() {
  const r = await fetch('/api/rates');
  const rates = await r.json();
  const tbody = document.getElementById('rates-body');
  if (!rates.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">Курсы не заданы</td></tr>';
    return;
  }
  tbody.innerHTML = rates.map(row => `
    <tr id="rate-${row.month}-${row.currency}">
      <td>${row.month}</td>
      <td><span class="cur-badge">${row.currency}</span></td>
      <td>${row.rate_to_eur.toFixed(6)}</td>
      <td><button class="del-btn" title="Удалить" onclick="deleteRate('${row.month}','${row.currency}')">×</button></td>
    </tr>`).join('');
}

async function addRate() {
  const month    = document.getElementById('f-month').value.trim();
  const currency = document.getElementById('f-currency').value.trim().toUpperCase();
  const rate     = parseFloat(document.getElementById('f-rate').value);

  if (!month || !currency || isNaN(rate) || rate <= 0) {
    alert('Заполните все поля корректно');
    return;
  }

  const r = await fetch(`/api/rates/${month}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({currency, rate}),
  });
  if (r.ok) {
    document.getElementById('f-rate').value = '';
    await loadRates();
  }
}

async function deleteRate(month, currency) {
  await fetch(`/api/rates/${month}/${currency}`, {method: 'DELETE'});
  document.getElementById(`rate-${month}-${currency}`)?.remove();
  const tbody = document.getElementById('rates-body');
  if (!tbody.children.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">Курсы не заданы</td></tr>';
  }
}

// Pre-fill month input to current month
const now = new Date();
document.getElementById('f-month').value =
  `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

loadRates();
</script>
</body>
</html>
