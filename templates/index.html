<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Финансы</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f0f2f5;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --expense:#ef4444;
  --income:#22c55e;
  --primary:#2563eb;
  --header:#1e3a5f;
  --radius:14px;
  --shadow:0 1px 6px rgba(0,0,0,.08);
}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ── */
header{
  background:var(--header);color:#fff;
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  gap:10px;
}
header h1{font-size:15px;font-weight:700;letter-spacing:.5px;white-space:nowrap}

.month-nav{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:24px;padding:6px 12px;flex:1;justify-content:center}
.month-nav button{background:none;border:none;color:#fff;font-size:20px;line-height:1;cursor:pointer;opacity:.75;transition:opacity .15s;padding:0 2px}
.month-nav button:hover{opacity:1}
.month-nav button:disabled{opacity:.25;cursor:default}
#month-label{font-size:13px;font-weight:600;min-width:100px;text-align:center}

.cur-select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;color:#fff;font-size:12px;font-weight:700;padding:5px 8px;cursor:pointer;outline:none;-webkit-appearance:none}
.cur-select option{background:#1e3a5f;color:#fff}

/* ── LAYOUT ── */
.container{max-width:560px;margin:0 auto;padding:14px 12px}

/* ── STAT CARDS ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat-card .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
.stat-card .amt{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat-card .cur{font-size:11px;font-weight:400;color:var(--muted);margin-left:2px}
.expense-card .amt{color:var(--expense)}
.income-card .amt{color:var(--income)}
.missing-rate{font-size:10px;color:#f59e0b;margin-top:2px}

/* ── CHART ── */
.chart-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:12px;display:flex;justify-content:center}
.chart-wrap{position:relative;width:210px;height:210px}
.chart-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.chart-center .total{font-size:18px;font-weight:700;color:var(--expense)}
.chart-center .lbl{font-size:11px;color:var(--muted);margin-top:2px}

/* ── CATEGORY LIST ── */
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 0 8px 4px}
.category-list{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.category-row{
  background:var(--card);border-radius:var(--radius);padding:13px 14px;
  box-shadow:var(--shadow);cursor:pointer;
  display:flex;align-items:center;gap:11px;
  transition:transform .1s;-webkit-tap-highlight-color:transparent;
}
.category-row:active{transform:scale(.98)}
.cat-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:15px;font-weight:500}
.cat-bar-wrap{height:3px;background:#f3f4f6;border-radius:2px;margin-top:6px;overflow:hidden}
.cat-bar{height:100%;border-radius:2px;transition:width .5s ease}
.cat-breakdown{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.cat-right{text-align:right;flex-shrink:0}
.cat-right .amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.cat-right .cnt{font-size:11px;color:var(--muted);margin-top:2px}
.cat-right .approx{font-size:10px;color:#f59e0b}
.cat-chevron{color:#d1d5db;font-size:18px;flex-shrink:0;margin-left:-2px}

/* ── TX VIEW ── */
#tx-view{display:none}
.tx-back{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--primary);font-size:15px;cursor:pointer;padding:0 0 10px}
.tx-head{background:var(--card);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.tx-head h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.tx-head .sub{font-size:13px;color:var(--muted);margin-top:5px}
.tx-list{display:flex;flex-direction:column;gap:8px}
.tx-row{background:var(--card);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.tx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tx-desc{font-size:14px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.tx-bottom{display:flex;align-items:center;gap:8px;margin-top:5px}
.tx-date{font-size:12px;color:var(--muted)}
.bank-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:#f3f4f6;color:var(--muted);padding:2px 8px;border-radius:10px}
.cat-badge{font-size:10px;font-weight:600;background:#eff6ff;color:var(--primary);padding:2px 8px;border-radius:10px}
.edit-cat-btn{background:none;border:none;font-size:16px;cursor:pointer;color:#9ca3af;padding:0 0 0 4px;flex-shrink:0;line-height:1}
.edit-cat-btn:hover{color:var(--primary)}

.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;line-height:1.6}

/* ── IMPORTS VIEW ── */
.imports-link{display:block;width:100%;background:none;border:none;color:var(--muted);font-size:13px;padding:16px 4px 8px;cursor:pointer;text-align:center}
.imports-link:hover{color:var(--primary)}
.rates-link{display:block;width:100%;background:none;border:none;color:var(--muted);font-size:12px;padding:4px;cursor:pointer;text-align:center}
.rates-link:hover{color:var(--primary)}
.import-row{background:var(--card);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.import-info{flex:1;min-width:0}
.import-file{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.import-meta{font-size:12px;color:var(--muted);margin-top:3px}
.import-count{font-size:13px;font-weight:700;color:var(--muted);flex-shrink:0;text-align:right;min-width:44px}
.rollback-btn{background:#fee2e2;color:var(--expense);border:none;border-radius:10px;font-size:12px;font-weight:700;padding:7px 12px;cursor:pointer;flex-shrink:0;white-space:nowrap;transition:background .2s,color .2s}
.rollback-btn.confirming{background:var(--expense);color:#fff}
.rollback-btn:disabled{opacity:.4;cursor:default}

/* ── CATEGORY EDIT DIALOG ── */
.dialog-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center}
.dialog-overlay.open{display:flex}
.dialog-box{background:#fff;border-radius:18px 18px 0 0;padding:22px 18px 32px;width:100%;max-width:560px;box-shadow:0 -4px 24px rgba(0,0,0,.15)}
.dialog-title{font-size:16px;font-weight:700;margin-bottom:4px}
.dialog-sub{font-size:13px;color:var(--muted);margin-bottom:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dialog-select{width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:11px 12px;font-size:15px;outline:none;margin-bottom:16px;background:#fafafa}
.dialog-select:focus{border-color:var(--primary)}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dialog-btn{border:none;border-radius:12px;padding:13px 10px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.2}
.dialog-btn-one{background:#f3f4f6;color:var(--text)}
.dialog-btn-one:hover{background:#e5e7eb}
.dialog-btn-all{background:var(--primary);color:#fff}
.dialog-btn-all:hover{background:#1d4ed8}
.dialog-cancel{display:block;width:100%;background:none;border:none;color:var(--muted);font-size:14px;padding:14px 0 0;cursor:pointer;text-align:center}
</style>
</head>
<body>

<header>
  <h1>Финансы</h1>
  <div class="month-nav">
    <button id="btn-prev" onclick="prevMonth()">‹</button>
    <span id="month-label">—</span>
    <button id="btn-next" onclick="nextMonth()">›</button>
  </div>
  <select class="cur-select" id="base-currency" onchange="onBaseCurrencyChange()">
    <option value="EUR">EUR</option>
  </select>
</header>

<div class="container">

  <!-- Summary view -->
  <div id="summary-view">
    <div class="stats">
      <div class="stat-card expense-card">
        <div class="lbl">Расходы</div>
        <div class="amt" id="total-expense">—</div>
        <div class="missing-rate" id="expense-missing" style="display:none">≈ нет курса</div>
      </div>
      <div class="stat-card income-card">
        <div class="lbl">Доходы</div>
        <div class="amt" id="total-income">—</div>
        <div class="missing-rate" id="income-missing" style="display:none">≈ нет курса</div>
      </div>
    </div>
    <div class="chart-card" id="chart-card" style="display:none">
      <div class="chart-wrap">
        <canvas id="donut"></canvas>
        <div class="chart-center">
          <div class="total" id="chart-total">—</div>
          <div class="lbl">расходы</div>
        </div>
      </div>
    </div>
    <div id="lists"></div>
    <button class="imports-link" onclick="showImports()">История импортов ›</button>
    <a class="rates-link" href="/rates">Курсы валют ›</a>
  </div>

  <!-- Imports view -->
  <div id="imports-view" style="display:none">
    <button class="tx-back" onclick="backFromImports()">‹ Назад</button>
    <div class="section-title">История импортов</div>
    <div class="category-list" id="imports-list"></div>
  </div>

  <!-- Transactions view -->
  <div id="tx-view">
    <div class="tx-head">
      <button class="tx-back" onclick="backToSummary()">‹ Назад</button>
      <h2><span class="cat-dot" id="tx-dot"></span><span id="tx-title"></span></h2>
      <div class="sub" id="tx-sub"></div>
    </div>
    <div class="tx-list" id="tx-list"></div>
  </div>

</div>

<!-- Category edit dialog -->
<div class="dialog-overlay" id="cat-dialog" onclick="closeCatDialog(event)">
  <div class="dialog-box">
    <div class="dialog-title">Изменить категорию</div>
    <div class="dialog-sub" id="dialog-desc">—</div>
    <input class="dialog-select" id="dialog-cat-input" list="dialog-cat-list" placeholder="Выберите или введите категорию…" autocomplete="off">
    <datalist id="dialog-cat-list"></datalist>
    <div class="dialog-actions">
      <button class="dialog-btn dialog-btn-one" onclick="confirmCatChange(false)">Только эту</button>
      <button class="dialog-btn dialog-btn-all" onclick="confirmCatChange(true)">Все транзакции<br>этого мерчанта</button>
    </div>
    <button class="dialog-cancel" onclick="closeCatDialog()">Отмена</button>
  </div>
</div>

<script>
const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                   'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

const PALETTE = ['#6366f1','#f59e0b','#10b981','#ef4444','#3b82f6',
                 '#8b5cf6','#ec4899','#14b8a6','#f97316','#84cc16'];

const S = { months:[], idx:0, chart:null, expenses:[], income:[], categories:[] };

// Pending edit state
let _editTx = null;  // {id, description, currentCategory}

const fmt = n => Math.abs(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = iso => { const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; };
const monthLabel = ym => { const [y,m]=ym.split('-'); return `${MONTHS_RU[+m-1]} ${y}`; };
const baseCurrency = () => document.getElementById('base-currency').value;

async function init() {
  const [monthsRes, catsRes, cursRes] = await Promise.all([
    fetch('/api/months'),
    fetch('/api/categories'),
    fetch('/api/currencies'),
  ]);
  S.months = await monthsRes.json();
  S.categories = await catsRes.json();

  const curs = await cursRes.json();
  const sel = document.getElementById('base-currency');
  const current = sel.value;
  sel.innerHTML = '';
  const allCurs = [...new Set(['EUR', ...curs])];
  allCurs.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    if (c === current) o.selected = true;
    sel.appendChild(o);
  });

  if (!S.months.length) {
    document.getElementById('lists').innerHTML =
      '<div class="empty">Нет данных.<br>Загрузите выписку в папку inbox.</div>';
    return;
  }
  S.idx = 0;
  updateNav();
  await loadSummary();
}

function updateNav() {
  document.getElementById('month-label').textContent = monthLabel(S.months[S.idx]);
  document.getElementById('btn-prev').disabled = S.idx >= S.months.length - 1;
  document.getElementById('btn-next').disabled = S.idx <= 0;
}

function prevMonth() { if (S.idx < S.months.length-1) { S.idx++; updateNav(); loadSummary(); } }
function nextMonth() { if (S.idx > 0)                 { S.idx--; updateNav(); loadSummary(); } }

async function onBaseCurrencyChange() {
  await loadSummary();
}

async function loadSummary() {
  const base = baseCurrency();
  const r = await fetch(`/api/summary/${S.months[S.idx]}?base=${base}`);
  render(await r.json());
}

function totalForDisplay(items) {
  if (!items.length) return { text: '—', missing: false };
  const total = items.reduce((s, i) => s + i.total, 0);
  const isExp = total < 0;
  const cur = items[0].currency;
  const missing = items.some(i => i.missing_rate);
  const prefix = missing ? '≈ ' : '';
  const sign = isExp ? '−' : '+';
  return { text: `${prefix}${sign}${fmt(total)} <span class="cur">${cur}</span>`, missing };
}

function drawChart(expenses) {
  const labels = expenses.map(e => e.category);
  const values = expenses.map(e => Math.abs(e.total));
  const colors = expenses.map((_, i) => PALETTE[i % PALETTE.length]);
  const totalVal = values.reduce((a,b)=>a+b,0);
  const cur = expenses[0]?.currency || '';
  document.getElementById('chart-total').textContent = fmt(totalVal) + ' ' + cur;

  if (S.chart) S.chart.destroy();
  S.chart = new Chart(document.getElementById('donut').getContext('2d'), {
    type: 'doughnut',
    data: { labels, datasets:[{ data:values, backgroundColor:colors, borderWidth:2, borderColor:'#fff', hoverOffset:6 }] },
    options: {
      cutout: '68%',
      plugins: {
        legend: { display:false },
        tooltip: { callbacks: { label: c => ` ${c.label}: ${fmt(c.raw)} ${cur}` } }
      },
      onClick: (_, els) => { if (els.length) showCategory(expenses[els[0].index], els[0].index, true); }
    }
  });
}

function breakdownHtml(item) {
  if (!item.breakdown || item.breakdown.length <= 1) return '';
  const parts = item.breakdown.map(b => {
    const sign = b.total < 0 ? '−' : '+';
    return `${b.currency}: ${sign}${fmt(b.total)}`;
  });
  return `<div class="cat-breakdown">${parts.join(' · ')}</div>`;
}

function section(title, items, isExp) {
  const maxAbs = Math.max(...items.map(i => Math.abs(i.total)));
  const rows = items.map((item, i) => {
    const color = isExp ? PALETTE[i % PALETTE.length] : '#22c55e';
    const pct   = Math.round(Math.abs(item.total) / maxAbs * 100);
    const sign  = isExp ? '−' : '+';
    const amtColor = isExp ? 'var(--expense)' : 'var(--income)';
    const approx = item.missing_rate ? '<div class="approx">≈ нет курса</div>' : '';
    return `
    <div class="category-row" onclick="handleCatClick(${i},${isExp})">
      <div class="cat-dot" style="background:${color}"></div>
      <div class="cat-info">
        <div class="cat-name">${item.category}</div>
        <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%;background:${color}"></div></div>
        ${breakdownHtml(item)}
      </div>
      <div class="cat-right">
        <div class="amt" style="color:${amtColor}">${sign}${fmt(Math.abs(item.total))} ${item.currency}</div>
        <div class="cnt">${item.count} тр.</div>
        ${approx}
      </div>
      <div class="cat-chevron">›</div>
    </div>`;
  });
  return `<div class="section-title">${title}</div><div class="category-list">${rows.join('')}</div>`;
}

function render({expenses, income}) {
  S.expenses = expenses;
  S.income = income;

  const expDisplay = totalForDisplay(expenses);
  const incDisplay = totalForDisplay(income);

  document.getElementById('total-expense').innerHTML = expDisplay.text;
  document.getElementById('total-income').innerHTML  = incDisplay.text;
  document.getElementById('expense-missing').style.display = expDisplay.missing ? '' : 'none';
  document.getElementById('income-missing').style.display  = incDisplay.missing ? '' : 'none';

  const chartCard = document.getElementById('chart-card');
  if (expenses.length) { chartCard.style.display='flex'; drawChart(expenses); }
  else                 { chartCard.style.display='none'; }

  let html = '';
  if (expenses.length) html += section('Расходы', expenses, true);
  if (income.length)   html += section('Доходы',  income,  false);
  document.getElementById('lists').innerHTML = html;
}

function handleCatClick(i, isExp) {
  const item = isExp ? S.expenses[i] : S.income[i];
  showCategory(item, i, isExp);
}

async function showCategory(item, colorIdx, isExp) {
  const month = S.months[S.idx];
  const r = await fetch(`/api/transactions/${month}/${encodeURIComponent(item.category)}`);
  const txs = await r.json();

  const color   = isExp && colorIdx >= 0 ? PALETTE[colorIdx % PALETTE.length] : '#22c55e';
  const sign    = item.total < 0 ? '−' : '+';
  const approxPfx = item.missing_rate ? '≈ ' : '';

  document.getElementById('tx-dot').style.background = color;
  document.getElementById('tx-title').textContent    = item.category;
  document.getElementById('tx-sub').textContent =
    `${monthLabel(month)} · ${txs.length} тр. · ${approxPfx}${sign}${fmt(Math.abs(item.total))} ${item.currency}`;

  document.getElementById('tx-list').innerHTML = txs.map(tx => `
    <div class="tx-row" id="txrow-${tx.id}">
      <div class="tx-top">
        <div class="tx-desc" title="${escHtml(tx.description)}">${escHtml(tx.description)}</div>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
          <div class="tx-amt" style="color:${tx.amount<0?'var(--expense)':'var(--income)'}">
            ${tx.amount<0?'−':'+'}${fmt(Math.abs(tx.amount))} ${tx.currency}
          </div>
          <button class="edit-cat-btn" title="Изменить категорию" onclick="openCatDialog(${tx.id},'${escJs(tx.description)}','${escJs(tx.category||'')}')">✎</button>
        </div>
      </div>
      <div class="tx-bottom">
        <div class="tx-date">${fmtDate(tx.date)}</div>
        <div class="bank-badge">${tx.bank}</div>
        <div class="cat-badge" id="catbadge-${tx.id}">${escHtml(tx.category||'Прочее')}</div>
      </div>
    </div>`).join('');

  document.getElementById('summary-view').style.display = 'none';
  document.getElementById('tx-view').style.display      = 'block';
  window.scrollTo(0,0);
}

function backToSummary() {
  document.getElementById('tx-view').style.display      = 'none';
  document.getElementById('summary-view').style.display = 'block';
}

async function showImports() {
  document.getElementById('summary-view').style.display = 'none';
  document.getElementById('tx-view').style.display      = 'none';
  document.getElementById('imports-view').style.display = 'block';
  window.scrollTo(0, 0);
  await loadImports();
}

function backFromImports() {
  document.getElementById('imports-view').style.display = 'none';
  document.getElementById('summary-view').style.display = 'block';
}

async function loadImports() {
  const r = await fetch('/api/imports');
  const imports = await r.json();
  const el = document.getElementById('imports-list');
  if (!imports.length) {
    el.innerHTML = '<div class="empty">Импортов ещё нет.</div>';
    return;
  }
  el.innerHTML = imports.map(imp => {
    const dt = (imp.imported_at || '').slice(0, 16).replace('T', ' ');
    return `
    <div class="import-row" id="imp-${imp.import_id}">
      <div class="import-info">
        <div class="import-file" title="${imp.filename}">${imp.filename}</div>
        <div class="import-meta">${dt} · ${imp.bank || '—'}</div>
      </div>
      <div class="import-count">${imp.inserted} тр.</div>
      <button class="rollback-btn" onclick="rollbackImport('${imp.import_id}',this)">Откатить</button>
    </div>`;
  }).join('');
}

async function rollbackImport(importId, btn) {
  if (!btn.dataset.confirming) {
    btn.dataset.confirming = '1';
    btn.classList.add('confirming');
    btn.textContent = 'Точно?';
    setTimeout(() => {
      btn.dataset.confirming = '';
      btn.classList.remove('confirming');
      btn.textContent = 'Откатить';
    }, 3000);
    return;
  }
  btn.disabled = true;
  btn.textContent = '…';
  await fetch(`/api/imports/${importId}`, {method: 'DELETE'});
  document.getElementById(`imp-${importId}`)?.remove();
  S.idx = 0;
  await init();
}

// ── Category edit dialog ─────────────────────────────────────────────────────

function openCatDialog(txId, description, currentCategory) {
  _editTx = {id: txId, description, currentCategory};
  document.getElementById('dialog-desc').textContent = description || '—';

  const inp = document.getElementById('dialog-cat-input');
  inp.value = currentCategory || '';
  const dl = document.getElementById('dialog-cat-list');
  dl.innerHTML = S.categories.map(c => `<option value="${escHtml(c)}">`).join('');

  document.getElementById('cat-dialog').classList.add('open');
  setTimeout(() => inp.focus(), 80);
}

function closeCatDialog(evt) {
  if (evt && evt.target !== document.getElementById('cat-dialog')) return;
  document.getElementById('cat-dialog').classList.remove('open');
  _editTx = null;
}

async function confirmCatChange(applyToAll) {
  if (!_editTx) return;
  const newCat = document.getElementById('dialog-cat-input').value.trim();
  if (!newCat) return;
  document.getElementById('cat-dialog').classList.remove('open');

  // If new category, persist it to categories.json
  if (!S.categories.includes(newCat)) {
    await fetch('/api/categories', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: newCat}),
    });
    S.categories.push(newCat);
  }

  if (applyToAll) {
    // Saves rule + bulk-updates all existing transactions with this description
    await fetch('/api/merchant-rules', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({merchant: _editTx.description, category: newCat}),
    });
    // Update all visible badges with the same description
    document.querySelectorAll('.tx-row').forEach(row => {
      const desc = row.querySelector('.tx-desc')?.title;
      if (desc === _editTx.description) {
        row.querySelector('.cat-badge').textContent = newCat;
      }
    });
  } else {
    await fetch(`/api/transaction/${_editTx.id}/category`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({category: newCat}),
    });
    const badge = document.getElementById(`catbadge-${_editTx.id}`);
    if (badge) badge.textContent = newCat;
  }

  _editTx = null;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJs(s) {
  return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

init();
</script>
